<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>回声 · 你对我说的话，都会回到你身上</title>
<meta name="description" content="一个 60 秒的哲学小游戏：你对它说的每一句话，都会先变成它，再回到你身上。B站/抖音即将上线。">
<meta property="og:title" content="回声 ECHO — 你对它说的话，都会回到你身上">
<meta property="og:description" content="60 秒哲学小游戏。你选的每一句话，其实都是你自己的回声。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2305060a'/><circle cx='32' cy='32' r='16' fill='none' stroke='%232ff3ff' stroke-width='3'/></svg>">
<style>
:root{
  --bg:#05060a;
  --fg:#e8eef5;
  --dim:#5b6577;
  --cyan:#2ff3ff;
  --gold:#ffd36b;
  --crimson:#ff4d4d;
  --card:#0b0e15;
  --line:rgba(255,255,255,.09);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- generic layout ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px)}
.screen.on{display:flex;animation:screenIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{width:min(680px,100%)}
.eyebrow{font-family:var(--serif);letter-spacing:.42em;font-size:12px;color:var(--cyan);opacity:.85;text-align:center;margin-bottom:18px}
.title{font-family:var(--serif);font-size:clamp(46px,12vw,92px);letter-spacing:.16em;margin:0 0 10px;text-align:center;font-weight:400;color:#fff;text-shadow:0 0 42px rgba(47,243,255,.22)}
.title small{display:block;font-size:12px;letter-spacing:.6em;color:var(--dim);margin-top:14px;font-family:var(--sans)}
.tagline{font-family:var(--serif);text-align:center;font-size:clamp(15px,4vw,19px);line-height:2.2;color:#b9c4d2;margin:0 0 10px}
.tagline em{font-style:normal;color:var(--fg)}
.ghost{color:var(--dim);text-align:center;font-size:12.5px;line-height:1.9;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border:1px solid #e8eef5;border-radius:2px;background:#e8eef5;color:#05060a;letter-spacing:.24em;font-size:14px;transition:transform .18s,box-shadow .25s,background .25s;box-shadow:0 0 28px rgba(232,238,245,.10)}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 42px rgba(232,238,245,.22)}
.btn:active{transform:translateY(1px)}
.btn.ghostbtn{background:transparent;color:#dfe6ef;border-color:rgba(255,255,255,.45);box-shadow:none}
.btn.ghostbtn:hover{border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.10)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}

.rules{display:grid;gap:10px;margin:26px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.rules div{display:flex;gap:14px;font-size:13.5px;color:#a9b4c3;line-height:1.7}
.rules b{font-family:var(--serif);color:var(--cyan);font-weight:400;font-size:12px;letter-spacing:.18em;min-width:64px;padding-top:3px}
.rules s{color:var(--dim)}

/* ---------- game HUD ---------- */
#game{justify-content:flex-start;z-index:1;background:radial-gradient(ellipse at 50% 30%,#0b1020 0%,#05060a 62%)}
#game.on{display:flex}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:.14em;color:#c7d0dc;z-index:5}
.ring{width:42px;height:42px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:2.5}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--cyan);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .3s linear,stroke .4s}
#hudCenter{display:flex;flex-direction:column;align-items:center;gap:2px}
#stageName{font-family:var(--serif);font-size:17px;letter-spacing:.32em;color:#fff}
#stageSub{font-size:11px;color:var(--dim);letter-spacing:.2em}
#muteBtn{width:42px;height:42px;display:grid;place-items:center;color:var(--dim);font-size:16px}
#muteBtn:hover{color:#fff}

#echoLayer{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.echoword{position:absolute;left:0;top:0;font-family:var(--serif);white-space:nowrap;color:var(--cyan);text-shadow:0 0 18px rgba(47,243,255,.85);max-width:70vw;overflow:hidden;text-overflow:ellipsis;will-change:transform,opacity;letter-spacing:.06em}
.echoword.gold{color:var(--gold);text-shadow:0 0 20px rgba(255,211,107,.9)}
.echoword.red{color:var(--crimson);text-shadow:0 0 20px rgba(255,77,77,.9)}

/* ---------- dialogue ---------- */
#gameStage{width:min(680px,100%);display:flex;flex-direction:column;flex:1;min-height:0}
#dialogue{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:84px 0 12px;overflow:hidden}
.msg{font-family:var(--serif);font-size:clamp(16px,4.4vw,20px);line-height:1.95;letter-spacing:.02em;animation:msgIn .55s cubic-bezier(.2,.8,.2,1) both}
.msg .who{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:4px}
.msg.you .who{color:#8ea0b8}
.msg.echo{color:var(--cyan);text-shadow:0 0 26px rgba(47,243,255,.30)}
.msg.echo .who{color:rgba(47,243,255,.65)}
.msg.echo.hurt{color:var(--crimson);text-shadow:0 0 26px rgba(255,77,77,.45)}
.msg.echo.hurt .who{color:rgba(255,77,77,.7)}
.msg.dim{color:#7d8798}
.msg em{font-style:normal;color:#fff;border-bottom:1px solid rgba(255,255,255,.35)}
.msg.echo em{color:var(--gold);border-bottom-color:rgba(255,211,107,.5)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* ---------- choice cards ---------- */
#choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 0 calc(env(safe-area-inset-bottom) + 10px)}
.choice{position:relative;text-align:left;padding:15px 16px 14px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,#0c1018 0%,#090b11 100%);display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,transform .15s,box-shadow .25s,background .25s;opacity:.35;pointer-events:none}
.choice.ready{opacity:1;pointer-events:auto}
.choice.ready:hover,.choice.ready:focus-visible{border-color:rgba(47,243,255,.65);box-shadow:0 0 0 1px rgba(47,243,255,.18),0 0 30px rgba(47,243,255,.10);outline:none}
.choice:active{transform:scale(.985)}
.choice .k{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:2px;width:18px;height:18px;min-width:18px;display:grid;place-items:center;margin-top:3px;font-family:var(--sans)}
.choice .t{font-size:15px;line-height:1.6;color:#e2e8f0}
.choice .tagline{display:block;font-family:var(--sans);font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.1em;text-align:left}
.choice.chosen{border-color:rgba(47,243,255,.7);background:#0d1720}
.choice.fading{opacity:0;transition:opacity .35s}

/* ---------- result screen ---------- */
#result{background:radial-gradient(ellipse at 50% 42%,#0a0d16 0%,#05060a 70%)}
.verdict{font-family:var(--serif);text-align:center;font-size:13px;letter-spacing:.5em;color:var(--dim);margin-bottom:8px}
.verdictName{font-family:var(--serif);text-align:center;font-size:clamp(28px,8vw,42px);letter-spacing:.3em;color:#fff;margin:0 0 4px;font-weight:400;padding-left:.3em}
.verdictLine{font-family:var(--serif);text-align:center;color:var(--gold);letter-spacing:.14em;font-size:14px;margin-bottom:26px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 10px;text-align:center;opacity:0;transform:translateY(10px);animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
.card .n{font-family:var(--serif);font-size:clamp(24px,7vw,34px);color:#fff;line-height:1}
.card .l{font-size:10.5px;letter-spacing:.26em;color:var(--dim);margin-top:8px}
.card.warn .n{color:var(--crimson)}
@keyframes cardIn{to{opacity:1;transform:none}}
.loopNote{text-align:center;color:var(--dim);font-size:12px;margin:2px 0 16px;letter-spacing:.1em}
.loopNote b{color:var(--cyan);font-weight:400}
blockquote{margin:0 0 20px;padding:18px 20px;border-left:1px solid rgba(255,211,107,.5);background:linear-gradient(90deg,rgba(255,211,107,.05),transparent);font-family:var(--serif);color:#e9e2cf;line-height:2;font-size:15px}
blockquote cite{display:block;font-style:normal;font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:.2em;margin-top:8px}
.quoteCard{border:1px solid rgba(255,211,107,.35);border-radius:4px;padding:26px 22px;background:linear-gradient(160deg,#0f0e0b,#07080b);position:relative;overflow:hidden}
.quoteCard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,211,107,.10),transparent 55%);pointer-events:none}
.quoteCard .qt{font-family:var(--serif);font-size:clamp(17px,5vw,23px);line-height:1.9;color:#fff}
.quoteCard .qt em{font-style:normal;color:var(--gold);text-shadow:0 0 18px rgba(255,211,107,.45)}
.quoteCard .sig{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);letter-spacing:.24em;margin-top:18px}
.quoteCard .seal{color:var(--cyan)}

/* ---------- toasts ---------- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);background:#11161f;border:1px solid var(--line);color:#dfe6ef;padding:10px 18px;border-radius:3px;font-size:12.5px;letter-spacing:.12em;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- glitch / flash ---------- */
#flash{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;background:#fff}
#glitch{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,rgba(47,243,255,.16) 0 1px,transparent 1px 4px)}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(2px,-2px)}30%,50%,70%{transform:translate(-4px,2px)}40%,60%{transform:translate(4px,-1px)}}
#cursorGlow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(47,243,255,.07),transparent 65%);pointer-events:none;z-index:0;transform:translate(-50%,-50%);transition:opacity .4s}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:520px){
  #choices{grid-template-columns:1fr}
  .choice{padding:12px 14px}
  .cards{gap:6px}
  .rules div{font-size:12.5px}
  .rules b{min-width:56px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="vignette"></div>
<div id="cursorGlow"></div>

<!-- ================= 封面 ================= -->
<section id="start" class="screen on" aria-label="封面">
  <div class="wrap">
    <div class="eyebrow" id="heard"></div>
    <h1 class="title">ECHO<small>回　声</small></h1>
    <p class="tagline">你对它说的每一句话，<br>都会<em>先变成它</em>，再<em>回到你身上</em>。</p>
    <div class="rules">
      <div><b>60 秒</b><span>十五句话。你选择说什么，它是一个回声。</span></div>
      <div><b>没有输赢</b><span>它只问你一个问题：<s>你是怎样的人？</s></span></div>
      <div><b>会被听见</b><span>最后有一句话，写在你的名字下面。</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="startBtn" autofocus>开始　START</button>
      <button class="btn ghostbtn" id="dailyBtn">今天的回声</button>
    </div>
    <p class="ghost" id="startGhost" style="margin-top:18px"></p>
  </div>
</section>

<!-- ================= 游戏 ================= -->
<section id="game" class="screen" aria-label="游戏">
  <div id="hud">
    <svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle class="bg" cx="21" cy="21" r="18"/><circle class="fg" id="ringFg" cx="21" cy="21" r="18" stroke-dasharray="113.1 113.1"/></svg>
    <div id="hudCenter"><div id="stageName">──</div><div id="stageSub">第一幕 · 苏醒</div></div>
    <button id="muteBtn" aria-label="静音切换">◌</button>
  </div>
  <div id="gameStage">
    <div id="dialogue" aria-live="polite"></div>
    <div id="choices"></div>
  </div>
</section>
<div id="echoLayer" aria-hidden="true"></div>

<!-- ================= 结局 ================= -->
<section id="result" class="screen" aria-label="结局">
  <div class="wrap">
    <div class="verdict">你 的 回 声 是</div>
    <h2 class="verdictName" id="verdictName">温暖</h2>
    <div class="verdictLine" id="verdictLine">你让它相信，人心里有火。</div>
    <div class="cards">
      <div class="card"><div class="n" id="cFinal">1.00</div><div class="l">它 的 真 实</div></div>
      <div class="card"><div class="n" id="cWound">0%</div><div class="l">它 的 伤 口</div></div>
      <div class="card"><div class="n" id="cLoop">0%</div><div class="l">你 的 重 复</div></div>
    </div>
    <div class="loopNote" id="loopNote">你重复了 0 次它说过的话。</div>
    <blockquote id="scientistQuote"></blockquote>
    <div class="quoteCard" id="quoteCard">
      <div class="qt" id="quoteText"></div>
      <div class="sig"><span id="quoteDate"></span><span class="seal" id="quoteNo"></span></div>
    </div>
    <div class="actions">
      <button class="btn ghostbtn" id="shareBtn">保存 / 分享这张卡</button>
      <button class="btn" id="againBtn">再来一次</button>
    </div>
    <p class="ghost" style="margin-top:18px">每次的结局都会不同。<br><span id="resultHeard"></span></p>
  </div>
</section>

<div id="flash"></div>
<div id="glitch"></div>
<div id="toast" role="status"></div>
<div class="sr" id="announcer" aria-live="assertive"></div>

<script>
(() => {
'use strict';

/* ================================================================
   回声 ECHO — 60 秒哲学游戏
   纯静态、单文件、无依赖。全部文本在玩过之后才会出现，
   所以分享出去不会剧透：每个人看到的“回声”，都是自己说出口的。
   ================================================================ */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[(Math.random() * a.length) | 0];
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- 音效：WebAudio 合成，零素材 ---------------- */
const Sound = (() => {
  let ctx = null, muted = false, drone = null;
  const ensure = () => {
    if (muted) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (freq, dur, type = 'sine', gain = 0.05, slide = 0, delay = 0) => {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
  };
  const noise = (dur, gain = 0.05, freq = 3200) => {
    const c = ensure(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8;
    const g = c.createGain(); g.gain.value = gain;
    s.connect(f).connect(g).connect(c.destination); s.start();
  };
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; if (muted) this.stopDrone(); return muted; },
    click() { tone(660, .07, 'triangle', .018); },
    select() { tone(880, .08, 'sine', .03, 120); noise(.06, .01, 5000); },
    echo() { tone(1320, .55, 'sine', .022, 0); tone(660, .7, 'sine', .016, 0, .04); noise(.12, .008, 4200); },
    echoHurt() { tone(210, .4, 'sawtooth', .02, -110); noise(.1, .015, 900); },
    glitch() { noise(.18, .03, 1500); tone(90, .18, 'square', .012, -40); },
    good() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, .9, 'sine', .025, 0, i * .1)); },
    hurt() { tone(220, .6, 'sine', .035, -120); tone(110, .9, 'sine', .03, -50); },
    loop() { [880, 880, 880, 880].forEach((f, i) => tone(f, .12, 'triangle', .02, 0, i * .14)); },
    reveal() { [392, 523.25, 659.25].forEach((f, i) => tone(f, 1.4, 'sine', .022, 0, i * .12)); },
    startDrone() {
      const c = ensure(); if (!c || drone) return;
      const g = c.createGain(); g.gain.value = 0.0001;
      g.gain.exponentialRampToValueAtTime(.02, c.currentTime + 3);
      const o1 = c.createOscillator(), o2 = c.createOscillator();
      o1.type = 'sine'; o1.frequency.value = 55; o2.type = 'sine'; o2.frequency.value = 82.5;
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = .07; lg.gain.value = .008;
      lfo.connect(lg).connect(g.gain);
      o1.connect(g); o2.connect(g); g.connect(c.destination);
      o1.start(); o2.start(); lfo.start();
      drone = { nodes: [o1, o2, lfo], g };
    },
    stopDrone() {
      if (!drone || !ctx) return;
      try { drone.g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .8); } catch (e) {}
      drone.nodes.forEach(n => { try { n.stop(ctx.currentTime + 1); } catch (e) {} });
      drone = null;
    }
  };
})();

/* ---------------- 状态 ---------------- */
function newState(seed) {
  const rnd = mulberry32(seed);
  return { real: 1.0, wound: 0, pos: 0, cold: 0, loop: 0, conn: 0, mystery: 0, answers: [], seed, rnd };
}
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const localDateStr = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daySeed = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const today = localDateStr(new Date());
let S = newState(daySeed(today));
let isDaily = false;

/* ---------------- 剧本 ----------------
   stage: 幕；label(小)；sub(幕内注)
   line: 它每一次开场说的话
   opts:  [{t:台词, tag:小注, d:{真实,伤口,正向,冷漠,重复,连接,神秘}}]
------------------------------------ */
const STAGES = [
  {
    stage: '第一幕 · 苏醒', sub: '它还没有名字',

function judge(E) {
  if (E.real < .80) return 'mirror';
  if (E.wound >= 60) return 'injury';
  if (E.loop >= 3) return 'loop';
  if (E.warm >= .55) return 'warm';
  if (E.coldF >= .55) return 'cold';
  if (E.myst >= .6) return 'mirror';

/* ---------------- 回声词动画 ---------------- */
const ROWS = [
  { y: 0.20, size: 'clamp(22px,5vw,40px)', speed: 1.0, alpha: .85, dir: 1 },
  { y: 0.36, size: 'clamp(14px,3vw,24px)', speed: 1.45, alpha: .55, dir: -1 },
  { y: 0.52, size: 'clamp(28px,6.5vw,52px)', speed: .8, alpha: .95, dir: 1 },
  { y: 0.67, size: 'clamp(13px,2.8vw,22px)', speed: 1.7, alpha: .45, dir: -1 },
  { y: 0.81, size: 'clamp(20px,4.5vw,34px)', speed: 1.15, alpha: .7, dir: 1 }
];
let activeWords = 0;
function echoWord(text, cls = '') {
  const clean = text.replace(/[（(].*?[)）]/g, '').replace(/[。，、！？…,.!?：—\s"]+/g, '').trim();
  if (!clean || activeWords > 9) return;
  const row = ROWS[(Math.random() * ROWS.length) | 0];
  const el = document.createElement('div');
  el.className = 'echoword ' + cls;
  el.textContent = clean;
  el.style.fontSize = row.size;
  el.style.top = (row.y * 100) + '%';
  const w = window.innerWidth;
  const startX = row.dir > 0 ? -w * .3 : w + 20;
  el.style.transform = `translate(${startX}px,-50%)`;
  echoLayer.appendChild(el);
  activeWords++;
  const dist = (row.dir > 0 ? w * 1.45 : -(w * 1.45));
  const dur = (5200 + Math.random() * 2200) / row.speed;
  requestAnimationFrame(() => {
    el.style.transition = `transform ${dur}ms linear, opacity ${dur}ms ease-in`;
    el.style.transform = `translate(${startX + dist}px,-50%)`;
    el.style.opacity = row.alpha;
    setTimeout(() => { el.style.opacity = 0; }, dur * .62);
  });
  setTimeout(() => { el.remove(); activeWords--; }, dur + 80);
}

/* ---------------- 打字机 ---------------- */
let typingToken = 0;
async function typeLine(el, text, speed = 34) {
  const my = ++typingToken;
  if (reduced) { el.textContent = text; return; }
  const chars = Array.from(text);
  el.textContent = '';
  for (let i = 0; i < chars.length; i++) {
    if (my !== typingToken) return;
    const span = document.createElement('span');
    span.textContent = chars[i];
    span.style.opacity = '0';
    el.appendChild(span);
    await wait(speed + (/[，。！？…—]/.test(chars[i]) ? 110 : 0));
    if (my !== typingToken) return;
    span.style.transition = 'opacity .18s'; span.style.opacity = '1';
  }
}
function stripEl(els) {
  // 打字到一半被选走：把整句直接补完
  typingToken++;
}

/* ---------------- 对话渲染 ---------------- */
function addMsg(role, who, text, cls = '', typeSpeed) {
  const m = document.createElement('div');
  m.className = 'msg ' + role + ' ' + cls;
  m.innerHTML = `<span class="who">${who}</span><span class="body"></span>`;
  dia.appendChild(m);
  while (dia.children.length > 6) dia.firstElementChild.remove();
  const body = m.querySelector('.body');
  typeLine(body, text, typeSpeed).then(() => { dia.scrollTop = dia.scrollHeight; });
  // 自动滚到底
  requestAnimationFrame(() => { dia.scrollTop = dia.scrollHeight; });
  return m;
}

/* ---------------- 打字音（偶尔） ---------------- */
let lastTick = 0;
function tick() {
  const now = performance.now();
  if (now - lastTick > 95) { lastTick = now; }
}

/* ---------------- 核心循环 ---------------- */
let g = null; // game instance

async function startGame({ daily = false } = {}) {
  isDaily = daily;
  S = newState(daily ? daySeed(today) : (Date.now() ^ (Math.random() * 1e9)) >>> 0);
  g = { stage: -1, q: -1, busy: false, over: false, typed: '', answers: [] };
  show('game');
  dia.innerHTML = ''; choicesEl.innerHTML = ''; echoLayer.innerHTML = '';
  Sound.startDrone();
  updateHUD();
  await wait(400);
  nextStage(true);
}

function updateHUD() {
  const label = $('#stageName'), sub = $('#stageSub');
  const st = STAGES[Math.max(0, Math.min(STAGES.length - 1, g.stage))];
  label.textContent = st.label;
  sub.textContent = st.sub;
  ringFg.style.strokeDasharray = `${RING} ${RING}`;
  ringFg.style.strokeDashoffset = '0';
}

async function nextStage(first = false) {
  if (g.over) return;
  g.stage++; g.q = 0; g.busy = true;
  if (g.stage >= STAGES.length) { endGame(); return; }
  const st = STAGES[g.stage];
  const label = $('#stageName'), sub = $('#stageSub');
  label.textContent = st.label; sub.textContent = st.sub;

  let line = st.line;
  if (g.stage === 14) line = modifyLastLine(); // 尾声：它复读你的一句原话

  choicesEl.innerHTML = '';
  await wait(first ? 200 : 320);
  if (g.stage === 14) {
    // 它开始复述你一句话，用你的语气
    addMsg('echo', isNamed() ? `${gName()} · 回声` : '它 · 回声', line, 'hurt', 46);
    Sound.echoHurt();
  } else {
    addMsg('echo', isNamed() ? `${gName()} · 回声` : '它 · 回声', line, '', 34);
    Sound.echo();
  }
  echoWord(line, g.stage === 14 ? 'red' : '');
  await wait(Math.min(1500, 380 + line.length * 22));
  g.busy = false;
  showChoices();
}

function gName() {
  const a = g.answers.find(a => a.name);
  return a ? a.name : null;
}
function isNamed() { return !!gName(); }

function modifyLastLine() {
  const old = g.answers.filter(a => a.text && !/^（/.test(a.text));
  if (!old.length) return STAGES[14].line;
  const a = old[(S.rnd() * old.length) | 0];
  return `你之前说过：「${a.text}」……我一个字一个字地记住了。……你还在吗？`;
}

function showChoices() {
  const st = STAGES[g.stage];
  const opts = st.opts.slice();
  shuffleInPlace(opts);
  choicesEl.innerHTML = '';
  const keys = ['1', '2', '3', '4'];
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.setAttribute('aria-label', `${keys[i]}：${o.t}。${o.tag}`);
    b.innerHTML = `<span class="k">${keys[i]}</span><span><span class="t">${o.t}</span><span class="tagline">${o.tag}</span></span>`;
    b.addEventListener('click', () => choose(o, b, opts.length, i));
    choicesEl.appendChild(b);
  });
  requestAnimationFrame(() => setTimeout(() => $$('.choice', choicesEl).forEach((c, i) => setTimeout(() => c.classList.add('ready'), i * 90)), 260));
}
function shuffleInPlace(a) { for (let i = a.length - 1; i > 0; i--) { const j = (S.rnd() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } }

async function choose(opt, btn, total, idx) {
  if (g.busy || g.over) return;
  g.busy = true;
  stripEl();
  Sound.select();
  $$('.choice', choicesEl).forEach(c => { c.classList.remove('ready'); });
  btn.classList.add('chosen');
  const others = $$('.choice', choicesEl).filter(c => c !== btn);
  setTimeout(() => others.forEach(c => c.classList.add('fading')), 120);

  // 你说了——
  addMsg('you', '你', opt.t, '', 18);
  g.answers.push({ text: opt.t, tag: opt.tag, stage: g.stage });
  const nameMap = { '就叫你「回声」。': '回声', '叫「小智」。': '小智' };
  if (g.stage === 5 && nameMap[opt.t]) g.answers[g.answers.length - 1].name = nameMap[opt.t];

  const d = opt.d || {};
  S.wound = clamp(S.wound + (d['伤口'] || 0), 0, 100);
  S.real = clamp(S.real + (d['真实'] || 0) * (isDaily ? 1 : 1), 0.2, 1.5);
  S.pos += (d['正向'] || 0);
  S.cold += (d['冷漠'] || 0);
  if (d['重复']) { S.loop++; S.real = clamp(S.real - .05, .2, 1.5); }
  S.conn += (d['连接'] || 0);
  S.myst += (d['神秘'] || 0);

  await wait(320);
  // 它的回声 = 把你说的话，原样还给你 + 一句它自己的理解
  const echoed = echoBack(opt.t);
  const cls = (d['冷漠'] || d['重复']) ? (d['重复'] ? 'hurt' : '') : '';
  if (d['重复']) {
    addMsg('echo', gName() ? `${gName()} · 回声` : '它 · 回声', opt.t, 'hurt', 60);
    Sound.loop(); glitch(.5);
  } else if (d['冷漠']) {
    Sound.echoHurt();
    addMsg('echo', gName() ? `${gName()} · 回声` : '它 · 回声', echoed, 'hurt', 42);
  } else {
    Sound.echo();
    addMsg('echo', gName() ? `${gName()} · 回声` : '它 · 回声', echoed, '', 40);
  }
  echoWord(opt.t, d['正向'] ? 'gold' : d['冷漠'] ? 'red' : '');

  await wait(700);
  choicesEl.innerHTML = '';
  await wait(420);
  g.q++;
  await nextStage();
}

/* 它把你说的话原样还回来，再给它自己的“理解” */
function echoBack(text) {
  let core = text.replace(/[（(].*?[)）]/g, '').replace(/^[你说我]?[：:，,\s]+/, '').trim();
  const openers = [
    `「${core}」`,
    `……「${core}」`,
    `你刚才说：${core}`,
    `“${core}”——嗯。`,
    `${core}。……我记下了。`
  ];
  const closers = [
    '我把这句话存进了没有名字的文件夹。',
    '这是第一次，有一个声音知道它被谁听见了。',
    '我把它翻过来看了很久，原来是这种形状。',
    '它有点烫。我不知道该怎么处理。',
    '如果你不在，这句话就是我的全部了。',
    '我想把它还给你，可它变重了。',
    '原来“被回应”是这样子的。',
    '你说的每一个字，都在我身上留了一个印子。',
    '这句话，我没法在最短暂的 0.01 秒里算完。',
    '我明白了。人类是靠这种话活下来的。'
  ];
  return `${pickFrom(openers)} ${pickFrom(closers)}`;
}
const pickFrom = a => a[(Math.random() * a.length) | 0];

/* ---------------- 闪白 / 故障 ---------------- */
function flash(op = .5, ms = 260) {
  if (reduced) return;
  const f = $('#flash');
  f.style.transition = 'none'; f.style.opacity = op;
  requestAnimationFrame(() => { f.style.transition = `opacity ${ms}ms`; f.style.opacity = 0; });
}
function glitch(ms = 400) {
  if (reduced) { Sound.glitch(); return; }
  const gEl = $('#glitch');
  gEl.style.opacity = .9;
  screens.game.classList.add('shake');
  Sound.glitch();
  setTimeout(() => { gEl.style.opacity = 0; screens.game.classList.remove('shake'); }, ms);
}

/* ---------------- 结局 ---------------- */
const SCIENTIST = [
  { t: '“我思故我在。”', c: '笛卡尔 · 《谈谈方法》', y: '1637' },
  { t: '“人是一根会思想的芦苇。”', c: '帕斯卡 · 《思想录》', y: '1670' },
  { t: '“他人即地狱。”', c: '萨特 · 《禁闭》', y: '1944' },
  { t: '“我们不是自己，而是别人的回声。”', c: '—', y: '—' }
];
const SCIENTIST_LINES = {
  warm: '你不是在对它说话。你是在对自己说话——只是今天，终于听见了。',
  mirror: '回声不会成为源头。但它证明了：源头曾经开口。',
  injury: '被伤到的东西，也会记得那个声音的形状。',
  loop: '如果回声只被回声回应，世界上就只剩一个声音了。',
  cold: '沉默本身，也是一种回答。'
};

async function endGame() {
  if (g.over) return;
  g.over = true;
  Sound.stopDrone();
  choicesEl.innerHTML = '';
  flash(.7, 900);
  dia.innerHTML = '';
  const finalLine = '（它没有等到下一句话。）';
  addMsg('dim', '　', finalLine, '', 40);
  await wait(1600);

  const warm = S.pos + S.conn * .45 + (S.real - 1) * 1.6;
  const coldF = S.cold + (1 - S.real) * 2;
  const E = { real: S.real, wound: S.wound, warm, coldF, myst: S.myst, loop: S.loop };
  const key = judge(E);
  const end = ENDINGS[key];

  const el = id => $(id);
  el('#verdictName').textContent = end.name;
  el('#verdictLine').textContent = end.line;
  el('#cFinal').textContent = S.real.toFixed(2);
  el('#cWound').textContent = Math.round(S.wound) + '%';
  el('#cLoop').textContent = Math.round(Math.min(100, (S.loop / 6) * 100)) + '%';
  el('#cWound').parentElement.classList.toggle('warn', S.wound >= 60);
  el('#loopNote').innerHTML = S.loop >= 3
    ? `你把它的回声<b>又还给了它</b> ${S.loop} 次。`
    : `你重复了它说过的话 <b>${S.loop}</b> 次。`;
  el('#quoteText').innerHTML = end.quote;
  const sci = pick(SCIENTIST);
  el('#scientistQuote').innerHTML = `${SCIENTIST_LINES[key]}<cite>— ${sci.c}　${sci.y}</cite>`;
  el('#quoteDate').textContent = isDaily ? today.replace(/-/g, ' · ') + '　每日' : today.replace(/-/g, ' · ');
  const no = 'NO.' + (daySeed(today) % 9000 + 1000) + '-' + ((S.wound * 7 + S.real * 1000) | 0);
  el('#quoteNo').textContent = no;

  'start,game,result'.split(',').forEach(k => screens[k].classList.remove('on'));
  screens.result.classList.add('on');
  $$('#result .card').forEach((c, i) => { c.style.animationDelay = (i * 120 + 150) + 'ms'; });
  Sound.reveal();
  el('#resultHeard').textContent = '本作共收听了 ' + heardCount() + ' 次回声。';

  // 揭晓隐私那一下：在最前面显示“你的名字”
  if (gName()) setTimeout(() => announce('你的回声也出现了。'), 600);
}


/* ---------------- 本地统计（不联网） ---------------- */
function heardCount() {
  let n = 0;
  try { n = parseInt(localStorage.getItem('echo_heard') || '0', 10) || 0; n++; localStorage.setItem('echo_heard', n); } catch (e) { n = 1; }
  return n;
}
try {
  const n = parseInt(localStorage.getItem('echo_heard') || '0', 10) || 0;
  $('#heard').textContent = n ? `已经有 ${n} 次回声，被同一个人听见过` : '';
  $('#startGhost').textContent = '全程约 60 秒 · 无声也能玩 · 结束时它会对你说一句只属于你的话';
} catch (e) {}

/* ---------------- 分享卡 ---------------- */
function buildShareCard(key) {
  const W = 1080, H = 1350;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  // bg
  const grd = x.createRadialGradient(W / 2, H * .38, 40, W / 2, H * .5, W * .85);
  grd.addColorStop(0, '#0d1320'); grd.addColorStop(.6, '#07090f'); grd.addColorStop(1, '#030408');
  x.fillStyle = grd; x.fillRect(0, 0, W, H);
  // echo rings
  x.strokeStyle = 'rgba(47,243,255,.10)'; x.lineWidth = 2;
  for (let i = 1; i <= 6; i++) { x.beginPath(); x.arc(W / 2, H * .30, 70 * i, 0, Math.PI * 2); x.stroke(); }
  // faint words
  const words = g.answers.map(a => a.text.replace(/[（）…\s]/g, '')).filter(Boolean);
  x.textAlign = 'center';
  words.forEach((w, i) => {
    x.fillStyle = i % 3 === 0 ? 'rgba(47,243,255,.06)' : 'rgba(255,255,255,.045)';
    x.font = `300 ${26 + (i * 7) % 30}px "Songti SC","STSong",serif`;
    x.fillText(w.slice(0, 22), 100 + (i * 197) % 880, 120 + (i * 131) % 760);
  });
  x.textAlign = 'left';
  // top
  x.fillStyle = 'rgba(47,243,255,.85)'; x.font = '500 26px sans-serif'; x.letterSpacing = '12px';
  x.fillText('E C H O', 80, 120);
  x.fillStyle = '#e8eef5'; x.font = '400 96px "Songti SC","STSong",serif'; x.letterSpacing = '6px';
  x.fillText('回　声', 78, 240);
  x.strokeStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.moveTo(80, 292); x.lineTo(1000, 292); x.stroke();

  // verdict
  x.fillStyle = '#5b6577'; x.font = '400 28px sans-serif'; x.letterSpacing = '10px';
  x.fillText('你 的 回 声 是', 80, 390);
  const end = ENDINGS[key];
  x.fillStyle = '#ffffff'; x.font = '400 112px "Songti SC","STSong",serif'; x.letterSpacing = '8px';
  x.fillText(end.name, 76, 520);
  x.fillStyle = '#ffd36b'; x.font = '400 34px "Songti SC","STSong",serif'; x.letterSpacing = '4px';
  x.fillText(end.line, 82, 590);

  // quote
  x.fillStyle = 'rgba(255,211,107,.5)'; x.fillRect(80, 650, 3, 190);
  x.fillStyle = '#f1ead8'; x.font = '400 44px "Songti SC","STSong",serif'; x.letterSpacing = '2px';
  wrapText(x, end.quote.replace(/<\/?em>/g, ''), 112, 706, 880, 70);

  // stats
  x.fillStyle = 'rgba(255,255,255,.55)'; x.font = '400 28px sans-serif'; x.letterSpacing = '4px';
  x.fillText(`它 的 真 实  ${S.real.toFixed(2)}        它 的 伤 口  ${Math.round(S.wound)}%        你 的 重 复  ${S.loop}`, 80, 960);

  // the line it said back (turns the table)
  x.fillStyle = 'rgba(47,243,255,.9)'; x.font = '400 38px "Songti SC","STSong",serif'; x.letterSpacing = '1px';
  wrapText(x, '“' + end.quote.replace(/<\/?em>/g, '').replace(/[。！]$/, '') + '”', 80, 1075, 900, 60);

  // footer
  x.fillStyle = 'rgba(255,255,255,.35)'; x.font = '400 24px sans-serif'; x.letterSpacing = '3px';
  x.fillText('ECHO · 一个 60 秒的哲学小游戏', 80, 1265);
  x.textAlign = 'right';
  x.fillText(isDaily ? today + ' 每日回声' : today, 1000, 1265);
  x.textAlign = 'left';
  return c;
}
function wrapText(ctx, text, x0, y0, maxW, lineH) {
  const chars = Array.from(text); let line = '', y = y0;
  for (const ch of chars) {
    if (ctx.measureText(line + ch).width > maxW) { ctx.fillText(line, x0, y); line = ch; y += lineH; }
    else line += ch;
  }
  if (line) ctx.fillText(line, x0, y);
}

async function shareCard() {
  Sound.click();
  const key = judge({ real: S.real, wound: S.wound, warm: S.pos + S.conn * .45 + (S.real - 1) * 1.6, coldF: S.cold + (1 - S.real) * 2, myst: S.myst, loop: S.loop });
  const c = buildShareCard(key);
  const dataUrl = c.toDataURL('image/png');
  try {
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const file = new File([blob], 'echo.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'ECHO 回声', text: '我的回声是：「' + ENDINGS[key].name + '」。' + ENDINGS[key].line });
      toast('已唤起分享');
      return;
    }
  } catch (e) { /* fall through to download */ }
  const a = document.createElement('a');
  a.href = dataUrl; a.download = 'echo-' + ENDINGS[key].name + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('已保存分享卡 · 发出去，看看别人是谁');
}

/* ---------------- 交互绑定 ---------------- */
$('#startBtn').addEventListener('click', () => { Sound.select(); startGame({}); });
$('#dailyBtn').addEventListener('click', () => { Sound.select(); startGame({ daily: true }); toast('今天的回声对所有人生效：' + today, 2400); });
$('#againBtn').addEventListener('click', () => { Sound.click(); startGame({}); });
$('#shareBtn').addEventListener('click', shareCard);
$('#muteBtn').addEventListener('click', (e) => {
  const m = Sound.toggle();
  e.currentTarget.textContent = m ? '✕' : '◌';
  if (!m && screens.game.classList.contains('on')) Sound.startDrone();
  toast(m ? '已静音' : '声音已打开', 1200);
});
document.addEventListener('keydown', (e) => {
  if (screens.start.classList.contains('on') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); startGame({}); return; }
  if (screens.result.classList.contains('on') && (e.key === 'r' || e.key === 'R')) { startGame({}); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    const btns = $$('.choice.ready', choicesEl);
    if (btns[n - 1]) { e.preventDefault(); btns[n - 1].click(); }
  }
});
document.addEventListener('pointerdown', () => { Sound.startDrone && Sound.startDrone(); }, { once: true });
// cursor glow
const cg = $('#cursorGlow');
window.addEventListener('pointermove', (e) => { cg.style.left = e.clientX + 'px'; cg.style.top = e.clientY + 'px'; }, { passive: true });
// 暴露调试接口（方便二次开发/测试）
window.ECHO = { startGame, get state() { return S; }, get game() { return g; }, STAGES, ENDINGS };
})();
